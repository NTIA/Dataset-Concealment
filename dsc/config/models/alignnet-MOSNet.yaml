hydra:
  run:
      dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
      chdir: True

defaults:
  - logging: clearml
  - loss: L2
  - data: mosnet-data
  - _self_

project:
  name: Dataset Alignment
  task: MOSNet-AlignNet

finetune:
  restore_file: null

common:
  seed: 1234
  auto_batch_size: false
  lr: 0.0001

dataclass:
  _target_: hydra.utils.get_class
  path: alignnet.MOSNetAudioData

optimization:
  _target_: pytorch_lightning.Trainer
  accelerator: gpu
  devices:
  - 0
  log_every_n_steps: 5
  max_epochs: 200
  precision: 16-mixed

earlystop:
  _target_: pytorch_lightning.callbacks.early_stopping.EarlyStopping
  patience: 20

model:
  _target_: dsc.Model
  loss_weights: 1

network:
  _target_: dsc.AlignNet
  aligner_corr_threshold: 0.6
  audio_net_freeze_epochs: 0
  audio_net:
    _target_: dsc.MOSNet
  aligner:
    _target_: dsc.LinearSequenceAligner
    layer_dims:
    - 16
    - 16
    - 16
    - 16
    - 1
    reference_index: 0
    embedding_dim: 10

checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: val_loss
  mode: min
  filename: '{epoch}-{val_loss:.4f}'
  save_top_k: 5
  every_n_epochs: 1
  every_n_train_steps: null

optimizer:
  _target_: dsc.OptimizerWrapper
  class_name: torch.optim.Adam

transform:
  _target_: dsc.NoneTransform